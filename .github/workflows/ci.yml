name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: Lint, typecheck, test and build the JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint . && npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  preview:
    name: Publish the preview build to pkg.pr.new
    runs-on: ubuntu-latest
    needs: [javascript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx pkg-pr-new publish --commentWithSha
