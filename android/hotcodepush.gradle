// Applied through the line `hotcodepush init` adds to the app's build.gradle.
// After React Native bundles a variant, a store build (any build type but debug) runs `binary create` and any other build runs `resource-file write`.

import javax.inject.Inject
import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.tasks.Optional

// The app resolves the core from core-android's maven branch until the library is on Maven Central.
repositories {
    maven {
        url 'https://raw.githubusercontent.com/hotcodepush-team/core-android/maven/'
        content { includeGroup 'com.hotcodepush' }
    }
}

abstract class HotCodePushBinaryCreateTask extends DefaultTask {
    @Input
    abstract Property<String> getBinaryBuild()

    @Input
    abstract Property<String> getBinaryVersion()

    @InputDirectory
    @Optional
    abstract DirectoryProperty getJsBundleDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Internal
    abstract DirectoryProperty getProjectRoot()

    @InputDirectory
    @Optional
    abstract DirectoryProperty getResourcesDir()

    @Internal
    abstract DirectoryProperty getStagingDirectory()

    @Input
    abstract Property<Boolean> getStoreBuild()

    @Inject
    abstract ExecOperations getExecOperations()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void createBinary() {
        // Stages the embedded bundle as an uploaded bundle is laid out: the JavaScript beside its drawable directories.
        // Without a bundle the tree stays empty, which binary create reads as a build without an embedded bundle.
        fileSystemOperations.sync {
            if (jsBundleDir.present) it.from(jsBundleDir)
            if (resourcesDir.present) it.from(resourcesDir)
            it.into(stagingDirectory)
        }
        stagingDirectory.get().asFile.mkdirs()
        def npx = Os.isFamily(Os.FAMILY_WINDOWS) ? ['cmd', '/c', 'npx'] : ['npx']
        def command = storeBuild.get()
            ? ['binary', 'create', '--binary-version', binaryVersion.get(), '--binary-build', binaryBuild.get()]
            : ['resource-file', 'write']
        execOperations.exec {
            it.workingDir = projectRoot.get().asFile
            it.commandLine(npx + ['hotcodepush'] + command + [
                '--platform', 'android',
                '--embedded-bundle-path', stagingDirectory.get().asFile.path,
                '--resource-file-path', outputDirectory.file('hotcodepush.json').get().asFile.path,
            ])
        }
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def variantName = variant.name.capitalize()
    def bundleTaskName = "createBundle${variantName}JsAndAssets"
    // Metro serves a debuggable variant, so React Native bundles nothing for it.
    def bundleTask = tasks.names.contains(bundleTaskName) ? tasks.named(bundleTaskName) : null
    def reactExtension = project.extensions.findByName('react')
    def binaryCreateTask = tasks.register("createHotCodePushBinary${variantName}", HotCodePushBinaryCreateTask) {
        it.group = 'hotcodepush'
        it.description = "Writes hotcodepush.json into the ${variant.name} assets and creates the binary of a store build."
        it.binaryBuild.set(variant.outputs[0].versionCode.map { String.valueOf(it) })
        it.binaryVersion.set(variant.outputs[0].versionName)
        if (bundleTask != null) {
            it.jsBundleDir.set(bundleTask.flatMap { it.jsBundleDir })
            it.resourcesDir.set(bundleTask.flatMap { it.resourcesDir })
        }
        it.projectRoot.set(reactExtension == null ? rootProject.layout.projectDirectory.dir('..') : reactExtension.root)
        it.stagingDirectory.set(layout.buildDirectory.dir("intermediates/hotcodepush/${variant.name}"))
        it.storeBuild.set(variant.buildType != 'debug')
        // The resource file carries the build time as its floor, and a store build creates its binary on every run.
        // So the task never counts as up to date.
        it.outputs.upToDateWhen { false }
    }
    variant.sources.assets.addGeneratedSourceDirectory(binaryCreateTask) { it.outputDirectory }
}
