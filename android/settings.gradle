// Builds the library on its own for its unit tests, with React Native from the devDependency as an app build finds it.
// In an app, the root build script puts the React Native plugin on the classpath. Here the library is the root, so this file adds it.
includeBuild('../node_modules/@react-native/gradle-plugin')
rootProject.name = 'react-native-code-push'

def reactAndroidProperties = new Properties()
file('../node_modules/react-native/ReactAndroid/gradle.properties').withInputStream { reactAndroidProperties.load(it) }
gradle.rootProject {
    buildscript.dependencies.add('classpath', 'com.facebook.react:react-native-gradle-plugin')
    configurations.configureEach { resolutionStrategy.force("com.facebook.react:react-android:${reactAndroidProperties.VERSION_NAME}") }
}
